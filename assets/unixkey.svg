<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Crimson / Deep Rose) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    
    <!-- Subtle Inner Glow -->
    <linearGradient id="innerShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop Shadow for the Key Shape -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>

    <filter id="keyShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgGrad)" filter="url(#dropShadow)"/>
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#innerShine)"/>

  <!-- Keycap base shape (Notion / Keyboard aesthetics) -->
  <rect x="96" y="96" width="320" height="320" rx="48" fill="#FFFFFF" fill-opacity="0.12" filter="url(#keyShadow)"/>
  <rect x="96" y="96" width="320" height="312" rx="48" fill="#FFFFFF" fill-opacity="0.08"/>

  <!-- Distinctive "V" Glyph in stylized geometric strokes -->
  <path d="M168 184 L256 344 L344 184" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="44" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Vietnamese Circumflex / Accent Horn Accent (Golden Star accent or diacritic) -->
  <!-- A subtle modern accent dot or hat above the V representing tone/diacritic -->
  <circle cx="256" cy="152" r="16" fill="#FDE047"/>
</svg>
